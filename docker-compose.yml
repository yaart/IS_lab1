version: '3.8'
services:
  postgres:
    image: postgres:18-alpine
    container_name: islab1-db
    environment:
      POSTGRES_DB: studs
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: